<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="25" y1="55" x2="95" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <!-- Outer badge circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="url(#geminiGrad)" stroke-width="3"/>
  <!-- Copilot/Muse Cat Ears -->
  <path d="M26 52 L20 22 L46 36 Z" fill="#1E293B" stroke="url(#geminiGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M25 46 L23 28 L41 37 Z" fill="#A78BFA" opacity="0.5"/>
  <path d="M94 52 L100 22 L74 36 Z" fill="#1E293B" stroke="url(#geminiGrad)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M95 46 L97 28 L79 37 Z" fill="#60A5FA" opacity="0.5"/>
  <!-- Cat Head -->
  <rect x="24" y="34" width="72" height="58" rx="28" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
  <!-- Pilot Goggles / Visor -->
  <rect x="30" y="48" width="60" height="24" rx="12" fill="#0F172A" stroke="url(#visorGrad)" stroke-width="2.5"/>
  <!-- Glowing Eyes inside Visor -->
  <ellipse cx="46" cy="60" rx="5.5" ry="6.5" fill="#38BDF8"/>
  <circle cx="48" cy="58" r="2" fill="#FFFFFF"/>
  <ellipse cx="74" cy="60" rx="5.5" ry="6.5" fill="#C084FC"/>
  <circle cx="76" cy="58" r="2" fill="#FFFFFF"/>
  <!-- Cute Nose & Smile -->
  <polygon points="60,76 56,73 64,73" fill="#F472B6"/>
  <path d="M53 80 Q60 85 67 80" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <!-- Whiskers -->
  <line x1="16" y1="68" x2="27" y2="70" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="15" y1="75" x2="27" y2="75" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="68" x2="93" y2="70" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <line x1="105" y1="75" x2="93" y2="75" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Gemini 4-Point Star Sparkle on Forehead/Crown -->
  <path d="M60 12 C60 22 63 25 73 25 C63 25 60 28 60 38 C60 28 57 25 47 25 C57 25 60 22 60 12 Z" fill="url(#geminiGrad)"/>
  <circle cx="60" cy="25" r="2.5" fill="#FFFFFF"/>
  <!-- Little Mini Sparkle -->
  <path d="M98 14 C98 18 99 19 103 19 C99 19 98 20 98 24 C98 20 97 19 93 19 C97 19 98 18 98 14 Z" fill="#60A5FA"/>
</svg>
