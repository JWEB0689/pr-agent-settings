name: Autonomous CI Auto-Fixer

# Shared repair engine with three modes (see scripts/autofix.py):
#   pr        — fix review-bot findings / CI failures on a PR branch
#               (entry: per-repo autofix.yml via /autofix, auto-trigger, dispatch)
#   scheduled — a scheduled workflow failed on the default branch: open a
#               PR with the fix (entry: per-repo scheduled-autofix.yml)
# The issue_comment trigger was intentionally removed: autofix.yml already
# handles "/autofix" comments and calls this workflow, so a trigger here
# would run the repair twice concurrently.

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: "pr"
        description: "pr | scheduled"
      model:
        type: string
        default: "gemini-3.8-flash"
        description: "Gemini model to use"
      pr_number:
        type: string
        required: false
        description: "Pull request number (pr mode)"
      head_ref:
        type: string
        required: false
        description: "PR head branch ref (pr mode)"
      base_ref:
        type: string
        default: "origin/main"
        description: "Base branch ref (pr mode)"
      run_id:
        type: string
        required: false
        description: "Failed workflow run id (scheduled mode)"
      workflow_name:
        type: string
        required: false
        description: "Failed workflow name (scheduled mode)"
      head_sha:
        type: string
        required: false
        description: "Commit the failed run tested (scheduled mode)"
      run_url:
        type: string
        required: false
        description: "URL of the failed run (scheduled mode)"
    secrets:
      GEMINI_API_KEY:
        required: true

  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to repair"
        required: true
        type: string
      model:
        description: "Gemini Model"
        required: false
        default: "gemini-3.8-flash"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Metadata
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.mode }}" = "scheduled" ]; then
            [ -n "${{ inputs.run_id }}" ] || { echo "::error::scheduled mode needs run_id."; exit 1; }
            DEFAULT_BRANCH=$(gh api "repos/${{ github.repository }}" --jq .default_branch)
            SLUG=$(echo "${{ inputs.workflow_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g' | cut -c1-30 | sed 's/-$//')
            RID="${{ inputs.run_id }}"
            BRANCH="autofix/sched-${SLUG}-${RID: -6}"
            echo "mode=scheduled" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "base_ref=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "Resolved scheduled fix: branch=$BRANCH base=$DEFAULT_BRANCH"
            exit 0
          fi

          if [ -n "${{ inputs.pr_number }}" ]; then
            PR_NUM="${{ inputs.pr_number }}"
          elif [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
          elif [ -n "${{ github.event.issue.number }}" ]; then
            PR_NUM="${{ github.event.issue.number }}"
          else
            PR_NUM="$(jq -r '.workflow_run.pull_requests[0].number // .check_suite.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
            if [ -z "$PR_NUM" ]; then
              HEAD_BRANCH="$(jq -r '.workflow_run.head_branch // .check_suite.head_branch // empty' "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
              if [ -n "$HEAD_BRANCH" ]; then
                PR_NUM="$(gh pr list --repo "${{ github.repository }}" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"
              fi
            fi
          fi

          if [ -z "${PR_NUM:-}" ]; then
            if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event_name }}" = "check_suite" ]; then
              echo "No open PR associated with ${{ github.event_name }} event — skipping."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No PR number detected — dispatch with pr_number."
            exit 1
          fi

          echo "Resolving metadata for PR #$PR_NUM..."
          PR_JSON=$(gh pr view "$PR_NUM" --repo "${{ github.repository }}" --json state,mergedAt,headRefName,baseRefName,headRepositoryOwner)
          STATE=$(echo "$PR_JSON" | jq -r .state)
          MERGED_AT=$(echo "$PR_JSON" | jq -r '.mergedAt // empty')
          if [ "$STATE" != "OPEN" ]; then
            if [ "${{ github.event_name }}" = "workflow_run" ] || [ "${{ github.event_name }}" = "check_suite" ]; then
              echo "PR #$PR_NUM is $STATE — skipping."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::PR #$PR_NUM is $STATE${MERGED_AT:+ (merged at $MERGED_AT)} — nothing to repair. Re-run with an open PR number."
            exit 1
          fi
          HEAD_REF=$(echo "$PR_JSON" | jq -r .headRefName)
          BASE_REF="origin/$(echo "$PR_JSON" | jq -r .baseRefName)"
          HEAD_OWNER=$(echo "$PR_JSON" | jq -r .headRepositoryOwner.login)

          echo "mode=pr" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_owner=$HEAD_OWNER" >> "$GITHUB_OUTPUT"

      - name: Checkout PR Branch
        if: steps.meta.outputs.mode == 'pr'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout base commit
        if: steps.meta.outputs.mode == 'scheduled'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create fix branch
        if: steps.meta.outputs.mode == 'scheduled'
        run: git checkout -b "${{ steps.meta.outputs.branch }}"

      - name: Setup Node & Rust Toolchains
        uses: actions/setup-node@v6
        with:
          node-version: 20
        continue-on-error: true

      - name: Setup Rust Toolchain (if Cargo.toml exists)
        if: hashFiles('**/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@stable
        continue-on-error: true

      - name: Setup Python Toolchain (if pyproject/requirements exist)
        if: hashFiles('**/pyproject.toml', '**/requirements.txt') != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
        continue-on-error: true

      - name: Execute Autonomous Repair
        if: steps.meta.outputs.mode != 'skip'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || 'gemini-3.8-flash' }}
          MODE: ${{ steps.meta.outputs.mode }}
          TRIGGER_EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.meta.outputs.pr_number }}
          HEAD_REF: ${{ steps.meta.outputs.head_ref }}
          BASE_REF: ${{ steps.meta.outputs.base_ref }}
          RUN_ID: ${{ inputs.run_id }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RUN_URL: ${{ inputs.run_url }}
          BRANCH: ${{ steps.meta.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/JWEB0689/pr-agent-settings/main/scripts/qodo_review.py -o /tmp/qodo_review.py
          curl -fsSL https://raw.githubusercontent.com/JWEB0689/pr-agent-settings/main/scripts/autofix.py -o /tmp/autofix.py
          chmod +x /tmp/qodo_review.py /tmp/autofix.py
          python3 /tmp/autofix.py
